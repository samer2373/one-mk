[package]
name = "one-mk"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
fs4 = "1.1.0"
if-addrs = "0.15.0"
one-mk-ctl = { path = "../ctl" }
one-mk-clipboard = { path = "../clipboard" }
one-mk-input = { path = "../input" }
one-mk-net = { path = "../net" }
one-mk-proto = { path = "../proto" }
quinn = { version = "0.11.12", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-std", "io-util", "net", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
zeroize = "1.9.1"
ring = "0.17.14"
constant_time_eq = "0.4.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"
url = "2.5.8"
serde_json = "1.0"

[dev-dependencies]
one-mk-input = { path = "../input", features = ["null-typing-tests"] }
tokio = { version = "1.54.1", features = ["test-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Desktop notifications over D-Bus (already in the build through ashpd).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
futures-util = { version = "0.3.34", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
