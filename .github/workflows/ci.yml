name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wallpaper-import-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: stable }
      - run: cargo test --locked -j 2 -p one-mk-wall-import
      - run: cargo clippy --locked -j 2 -p one-mk-wall-import --all-targets -- -D warnings
      - run: python3 scripts/check-wallpaper-artifact.py --self-test
      - run: python3 scripts/test-wallpaper-release-gates.py
      - run: python3 tools/gnome-wallpaper/test_presentation_cleanup.py
      # The GNOME extensions against stand-ins for the Shell (Node is on the runner).
      - run: node --test tools/gnome-wallpaper/test_production_video.mjs tools/gnome-wallpaper/test_pointer_extension.mjs
      - run: |
          cargo build --locked -j 2 -p one-mk-wall-import
          cargo metadata --locked --format-version 1 > target/wallpaper-metadata.json
          cargo tree --locked -p one-mk -e features > target/daemon-features.txt
          cargo tree --locked -p one-mk-wall --features gnome-bridge -e features > target/renderer-features.txt
          python3 scripts/check-wallpaper-artifact.py --metadata target/wallpaper-metadata.json --daemon-features target/daemon-features.txt --renderer-features target/renderer-features.txt --helper target/debug/one-mk-wall-import --sbom target/wallpaper-import.cdx.json
      - run: cargo install --locked -j 2 --version 0.20.2 cargo-deny
      - run: cargo deny --locked --manifest-path crates/wall-import/Cargo.toml --all-features --config crates/wall-import/deny.toml check

  native-cross-check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: stable, targets: "${{ matrix.target }}", components: clippy }
      # Clippy, not just check: the macOS and Windows code is only linted here.
      - run: cargo clippy --locked -j 2 -p one-mk-wallpaper -p one-mk-wallpaper-helper -p one-mk-input -p one-mk-ctl -p one-mk-proto -p one-mk-app -p one-mk-tray --all-targets --target ${{ matrix.target }} -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: clippy }
      - run: cargo test --workspace --locked --no-fail-fast
        env: { RUST_BACKTRACE: "1" }
      # On each system itself: the daemon (one-mk-net) can't be linted
      # cross-compiled, and some code only exists on one system.
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # The same release checks release.yml runs before publishing: licence
  # notices, cargo-deny over the whole workspace, install.sh, and the
  # manifest/sign/publish steps against a stub gh.
  release-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: { tool: cargo-deny@0.20.2 }
      - run: python3 scripts/third-party-notices.py --check
      - run: cargo deny --locked --all-features check
      - run: bash scripts/test-install.sh
      - run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash scripts/check-updates.sh
      # One version, workflows with least privilege and pinned actions, every
      # advertised download made by release.yml, package metadata consistent
      # (scripts/check-release-consistency.py), and its own tests.
      - run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-release-consistency.py
          python3 scripts/test-release-consistency.py
          python3 scripts/test-update-manifest.py
          python3 scripts/test-windows-path.py

  # The Linux packages and the package-manager files, built from a debug
  # build and checked without installing anything (scripts/check-packaging.sh).
  packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: sh scripts/version.sh
      - run: cargo build --locked -j 4 -p one-mk -p one-mk-tray -p one-mk-app -p one-mk-wallpaper-helper -p one-mk-wall --features one-mk-wall/gnome-bridge
      - name: Install artwork-check dependencies
        run: |
          # PyPI first: apt's hosts sometimes do not resolve on the runners.
          sudo python3 -m pip install --disable-pip-version-check --retries 5 pillow || sh scripts/apt-install.sh python3-pil
      - run: BIN_DIR=target/debug sh scripts/check-packaging.sh
