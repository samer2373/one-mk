name: Bug report
description: Something in oneMK does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through SECURITY.md (a private report), never a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Moved the pointer off the right edge of the laptop
        2. Expected it on the desktop computer
        3. It stopped at the edge
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oneMK version
      description: The output of `one-mk --version` (the same on every computer, ideally).
      placeholder: one-mk 1.1.0
    validations:
      required: true
  - type: textarea
    id: systems
    attributes:
      label: Computers, systems and desktops
      description: Each computer involved, its operating system and version, and on Linux the desktop and session type.
      placeholder: |
        Laptop: Ubuntu 24.04, GNOME 46, Wayland (installed from the .deb)
        Desktop: Windows 11 23H2 (installer)
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `one-mk doctor`
      description: Run `one-mk doctor` on each computer involved and paste the output. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Logs (`one-mk -v run` shows more), screenshots, how often it happens, whether it worked in an earlier version.
