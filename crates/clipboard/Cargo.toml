[package]
name = "one-mk-clipboard"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
png = "0.18.1"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tempfile = "3.27.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

# Linux and the BSDs: X11 and, where the compositor offers it, the Wayland
# data-control protocol. See the note on GNOME in src/lib.rs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xfixes"] }
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
