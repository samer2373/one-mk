name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-14,        target: x86_64-apple-darwin }
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p one-mk -p one-mk-tray -p one-mk-app
      - name: Package
        shell: bash
        run: |
          d=target/${{ matrix.target }}/release
          name=one-mk-${{ matrix.target }}
          mkdir "$name"
          if [ "${{ runner.os }}" = Windows ]; then
            cp $d/one-mk.exe $d/one-mk-tray.exe $d/one-mk-app.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp $d/one-mk $d/one-mk-tray $d/one-mk-app "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Mac app
        if: runner.os == 'macOS'
        run: sh scripts/bundle-mac.sh target/${{ matrix.target }}/release one-mk-${{ matrix.target }}.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: one-mk-*.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum one-mk-* > SHA256SUMS
      - name: Notes
        run: |
          cat > notes.md <<'MD'
          ## Download

          | System | File |
          |---|---|
          | macOS, Apple silicon (M1 and later) | `one-mk-aarch64-apple-darwin.app.zip` |
          | macOS, Intel | `one-mk-x86_64-apple-darwin.app.zip` |
          | Windows 10/11, 64-bit | `one-mk-x86_64-pc-windows-msvc.zip` |
          | Linux, 64-bit (Wayland) | `one-mk-x86_64-unknown-linux-gnu.tar.gz` |

          On macOS and Linux the one-line installer picks the right file:
          `curl -fsSL https://raw.githubusercontent.com/samer2373/one-mk/main/install.sh | sh`

          The `.tar.gz` for macOS holds only the command-line programs. `SHA256SUMS` lists checksums for every file.
          MD
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
