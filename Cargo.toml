[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/one-mk", "crates/tray", "crates/app"]

[workspace.package]
version = "0.1.14"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# For measuring only: the fat-LTO release profile can run out of memory.
[profile.bench-opt]
inherits = "release"
lto = false
codegen-units = 16
