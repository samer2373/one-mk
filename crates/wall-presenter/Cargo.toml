[package]
name = "one-mk-wall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default-disabled wallpaper presentation stop-gate probe (not a media importer)"

[features]
default = []
gnome-risk-probe = ["dep:libloading", "dep:libc", "dep:blake3", "dep:wayland-client", "dep:wayland-protocols"]
gnome-bridge = ["dep:zbus", "dep:tokio", "dep:futures-util", "dep:libc", "dep:one-mk-wall-sync"]
# 6D-M1 laboratory presentation session and playback; never enabled in release builds.
m1-lab = ["gnome-bridge", "dep:blake3", "dep:wayland-client", "dep:wayland-protocols", "dep:one-mk-wall-import", "dep:serde", "dep:serde_json"]

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "=0.8.9", optional = true }
libc = { version = "0.2.191", optional = true }
blake3 = { version = "1.8.7", optional = true }
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client"], optional = true }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "signal"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
one-mk-wall-sync = { path = "../wall", optional = true }
one-mk-wall-import = { path = "../wall-import", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[[example]]
name = "bridge-conformance"
required-features = ["gnome-bridge"]

[[example]]
name = "bridge-lifecycle"
required-features = ["gnome-bridge"]
