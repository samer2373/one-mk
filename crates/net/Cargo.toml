[package]
name = "one-mk-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
description = "oneMK pairing identities and encrypted connections"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ring = "0.17.14"
constant_time_eq = "0.4.2"
zeroize = "1.9.1"
hostname = "0.4.2"
mdns-sd = "0.21.6"
one-mk-proto = { path = "../proto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
socket2 = "0.6"
rand = "0.10.3"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
