[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/one-mk", "crates/tray", "crates/app", "crates/wallpaper-helper"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Samer Abu-Sleem <samer2373@users.noreply.github.com>"]
repository = "https://github.com/samer2373/one-mk"
homepage = "https://github.com/samer2373/one-mk"
readme = "README.md"
# Shipped as programs, never published to crates.io.
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# For measuring only: the fat-LTO release profile can run out of memory.
[profile.bench-opt]
inherits = "release"
lto = false
codegen-units = 16
