[package]
name = "one-mk-ctl"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
one-mk-proto = { path = "../proto" }
zeroize = "1.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
semver = "1.0.28"

# The permission guide's window finder (macos_windows.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSError"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocationManager", "CLLocationManagerDelegate"] }
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWInterface", "CWWiFiClient", "CoreWLANTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFRunLoop", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGGeometry", "CGWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis"] }
windows = { version = "0.62.2", features = ["Foundation", "Security_Authorization_AppCapabilityAccess", "Win32_System_WinRT"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros"] }
futures-util = { version = "0.3.34", default-features = false }
