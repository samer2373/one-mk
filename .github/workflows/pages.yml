# Publishes the landing page in site/ to GitHub Pages:
# https://samer2373.github.io/one-mk/ (a project site under /one-mk/).
# Settings > Pages > Source must be "GitHub Actions". See site/README.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Sent by the release workflow once a release is public (its sizes are on the page).
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site's public address. For a custom domain, change this one line
      # (and add site/CNAME with the domain).
      SITE_URL: https://samer2373.github.io/one-mk/
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Copy the site without its tools and source-only files
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -rf _site/tools _site/README.md _site/css/fonts-file.css

      # The download buttons point at the latest release, so the version and
      # the sizes the page shows are that release's (main can be ahead of, or
      # behind, what is published). The release workflow starts this one after
      # it publishes. When the release cannot be read, the checkout's version
      # and the sizes in the source stay.
      - name: Read the version and download sizes of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sh scripts/version.sh)
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/latest" > release.json \
            && published=$(python3 -c 'import json, re; t = json.load(open("release.json"))["tag_name"]; assert re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", t); print(t[1:])') \
            && python3 -c 'import json; [print(a["name"], a["size"], sep="\t") for a in json.load(open("release.json"))["assets"]]' > sizes.tsv; then
            version=$published
          else
            echo "::warning::could not read the latest release; keeping the checkout's version and the sizes in the source"
            : > sizes.tsv
          fi
          echo "$version" > version.txt

      - name: Stamp the release version, the address and the sizes
        run: sh site/tools/stamp.sh _site "$(cat version.txt)" "$SITE_URL" sizes.tsv

      - name: Check every local link resolves
        run: |
          missing=0
          for f in _site/index.html _site/404.html; do
            for ref in $(grep -oE '(src|href|srcset)="[^"#][^"]*"' "$f" | sed -E 's/^[a-z]+="//; s/"$//' | tr ',' '\n' | awk '{print $1}'); do
              case $ref in http*|mailto:*|data:*|//*) continue ;; esac
              [ -e "_site/$ref" ] || { echo "missing: $ref (in $f)"; missing=1; }
            done
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
