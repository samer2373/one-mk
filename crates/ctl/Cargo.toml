[package]
name = "one-mk-ctl"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
one-mk-proto = { path = "../proto" }
zeroize = "1.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
semver = "1.0.28"

# The permission guide's window finder (macos_windows.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGError", "CGGeometry", "CGWindow"] }
