name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: cargo test --workspace --locked

  # The Linux packages and the package-manager files, built from a debug
  # build and checked without installing anything (scripts/check-packaging.sh).
  packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: sh scripts/version.sh
      - run: cargo build --locked -p one-mk -p one-mk-tray -p one-mk-app
      - run: BIN_DIR=target/debug sh scripts/check-packaging.sh
