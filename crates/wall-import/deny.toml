[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0", "0BSD", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [{ name = "ffmpeg-next" }, { name = "ffmpeg-sys-next" }, { name = "libmpv" }, { name = "x264" }, { name = "x265" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
