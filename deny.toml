# cargo-deny for the whole workspace: every crate of every program oneMK
# ships, on every platform the release builds. CI runs
#   cargo deny --locked --all-features check
# (.github/workflows/ci.yml, job release-gates). The optional wallpaper
# importer keeps its own stricter file, crates/wall-import/deny.toml.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Every vulnerability fails. Only these "unmaintained" notices are accepted,
# each a transitive crate with no maintained release the dependents can use
# yet; review them when eframe/accesskit, zbus or tao move on.
ignore = [
    # proc-macro-error: build-time macro of glib-macros (gtk 0.18, through tao
    # in the tray on Linux). Not in the running program.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk 0.18 (tao); no newer gtk-rs for tao yet" },
    # zvariant, zvariant_derive, zbus_names: folded into zbus 6; zbus 5 (and
    # accesskit, ashpd, atspi on it) still use them. Maintained by the zbus
    # project until the move; no safe upgrade exists.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; eframe/accesskit/ashpd are on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; eframe/accesskit/ashpd are on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; eframe/accesskit/ashpd are on zbus 5" },
]

[licenses]
confidence-threshold = 0.93
# Permissive licences only. Where a crate offers a choice (for example
# "Apache-2.0 OR GPL-2.0-only" for self_cell, or "... OR LGPL-2.1-or-later"
# for r-efi), cargo-deny accepts it through the permissive option listed here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is file-level copyleft: fine for an unmodified dependency, as long
# as its notice ships (THIRD-PARTY-NOTICES). Allowed for this crate only, so a
# new MPL dependency is a decision, not an accident.
exceptions = [
    { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
