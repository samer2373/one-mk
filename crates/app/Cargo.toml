[package]
name = "one-mk-app"
version.workspace = true
edition = "2024"

[[bin]]
name = "one-mk-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
one-mk-ctl = { path = "../ctl" }
one-mk-proto = { path = "../proto" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui = "0.37.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
