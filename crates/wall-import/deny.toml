[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0", "0BSD", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "ffmpeg" }, { name = "ffmpeg-sys" }, { name = "ffmpeg-next" }, { name = "ffmpeg-sys-next" },
    { name = "ffmpeg-sidecar" }, { name = "ffmpeg-the-third" }, { name = "ffmpeg-sys-the-third" },
    { name = "ffmpeg4" }, { name = "ffmpeg4-sys" }, { name = "ffmpeg5" }, { name = "ffmpeg5-sys" },
    { name = "ffmpeg6" }, { name = "ffmpeg6-sys" }, { name = "ffmpeg7" }, { name = "ffmpeg7-sys" },
    { name = "ac-ffmpeg" }, { name = "ac-ffmpeg-build" },
    { name = "rusty_ffmpeg" }, { name = "rsmpeg" }, { name = "video-rs" },
    { name = "libav" }, { name = "libav-sys" }, { name = "libavcodec" }, { name = "libavcodec-sys" },
    { name = "libmpv" }, { name = "libmpv-sys" }, { name = "libmpv2" }, { name = "libmpv2-sys" },
    { name = "mpv" }, { name = "mpv-sys" }, { name = "x264" }, { name = "x264-sys" },
    { name = "x265" }, { name = "x265-sys" }, { name = "xvid" }, { name = "xvid-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
