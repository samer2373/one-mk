[package]
name = "one-mk-clipboard"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
png = "0.18.1"
tokio = { version = "1.54.1", features = ["sync", "rt"] }
tracing = "0.1.44"
tempfile = "3.27.0"
unicode-general-category = "1.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

# Linux and the BSDs: X11 and, where the compositor offers it, the Wayland
# data-control protocol. See the note on GNOME in src/lib.rs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.5"
x11rb = { version = "0.13.2", features = ["xfixes"] }
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
