[package]
name = "one-mk-input"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
one-mk-proto = { version = "0.1.0", path = "../proto" }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast"] }
futures = "0.3.34"
libc = "0.2.191"
reis = { version = "0.7.1", features = ["tokio"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFMachPort", "CFDate", "CFDictionary", "CFString", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
