name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallpaper-gnome-dry-run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: stable }
      - name: Build the wallpaper helper the GNOME extension drives
        run: cargo build --release --locked -j 2 -p one-mk-wallpaper-helper
      - name: Package without installing, enabling, or publishing
        run: sh scripts/package-wallpaper-gnome.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-gnome-component-dry-run
          path: target/wallpaper-gnome-dry-run

  wallpaper-sbom-dry-run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with: { toolchain: stable }
      - name: Optional importer licence gate and SBOM (never published as a runtime)
        run: |
          mkdir -p target
          cargo build --locked -j 2 -p one-mk-wall-import
          cargo metadata --locked --format-version 1 > target/wallpaper-metadata.json
          cargo tree --locked -p one-mk -e features > target/daemon-features.txt
          cargo tree --locked -p one-mk-wall --features gnome-bridge -e features > target/renderer-features.txt
          python3 scripts/check-wallpaper-artifact.py --self-test
          python3 scripts/check-wallpaper-artifact.py --metadata target/wallpaper-metadata.json --daemon-features target/daemon-features.txt --renderer-features target/renderer-features.txt --helper target/debug/one-mk-wall-import --sbom target/wallpaper-import.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-import-sbom-dry-run
          path: target/wallpaper-import.cdx.json

  # Nothing is published unless the tagged commit passes the same tests and
  # lints as CI, on every system, and the release checks below. They run
  # beside the build; publish waits for both.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: clippy }
      - run: cargo test --workspace --locked --no-fail-fast
        env: { RUST_BACKTRACE: "1" }
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # Licences, advisories, the installer and the publish steps themselves.
  release-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: { tool: cargo-deny@0.20.2 }
      - name: THIRD-PARTY-NOTICES matches Cargo.lock
        run: python3 scripts/third-party-notices.py --check
      - name: Licences, advisories, bans and sources (deny.toml)
        run: cargo deny --locked --all-features check
      - name: install.sh against fake releases
        run: bash scripts/test-install.sh
      - name: One version, pinned workflows, every download made, package metadata
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-release-consistency.py
      - name: Update manifest, signing and publish steps (stub gh)
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash scripts/check-updates.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        target: aarch64-apple-darwin }
          - { os: macos-15,        target: x86_64-apple-darwin }
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # The tag has to be the version in Cargo.toml, the one place versions
      # come from. A manual run without a tag has nothing to check.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: sh scripts/version.sh --check "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p one-mk -p one-mk-tray -p one-mk-app -p one-mk-wallpaper-helper
      - if: runner.os == 'Linux'
        run: cargo build --release --locked -j 2 --target ${{ matrix.target }} -p one-mk-wall --features gnome-bridge
      - name: Package
        shell: bash
        run: |
          d=target/${{ matrix.target }}/release
          name=one-mk-${{ matrix.target }}
          umask 022
          mkdir "$name"
          sh scripts/copy-notices.sh "$name"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "$d/one-mk.exe" "one-mk-${{ matrix.target }}.exe"
            cp $d/one-mk.exe $d/one-mk-tray.exe $d/one-mk-app.exe $d/one-mk-wallpaper.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "$d/one-mk" "one-mk-${{ matrix.target }}.bin"
            cp $d/one-mk $d/one-mk-tray $d/one-mk-app $d/one-mk-wallpaper "$name"/
            if [ "${{ runner.os }}" = Linux ]; then
              BIN_DIR="$d" sh scripts/package-wallpaper-gnome.sh "$name/gnome-wallpaper"
              cp "$d/one-mk-wall" "$name"/
            fi
            # Folders 0755, programs 0755, every other file 0644: the archive
            # does not depend on the runner's umask (install.sh extracts it as is).
            find "$name" -type d -exec chmod 755 {} +
            find "$name" -type f ! -perm -u+x -exec chmod 644 {} +
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Mac app
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          # The updater installs only a Mac app signed with a Developer ID
          # (docs/UPDATES.md, step 4): an ad-hoc signed release would break
          # every Mac's update. A tag release therefore needs all five
          # secrets; a manual run without them builds an ad-hoc app and says so.
          missing=
          for secret in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            eval "value=\${$secret:-}"
            [ -n "$value" ] || missing="$missing $secret"
          done
          if [ -n "$missing" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error title=macOS signing secrets missing::Missing repository secrets:$missing. A release must be signed with a Developer ID and notarized: Macs refuse to update to an ad-hoc signed app. Add the secrets (Settings > Secrets and variables > Actions) and re-run this workflow." >&2
              exit 1
            fi
            echo "::warning title=Unsigned Mac app::Missing secrets:$missing. This manual build is ad-hoc signed and not notarized; it cannot be released."
          fi
          if [ -n "$MACOS_CERT_P12" ]; then
            kc=$RUNNER_TEMP/sign.keychain-db
            pw=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            export SIGN_IDENTITY="Developer ID Application"
          fi
          # dmgbuild draws the installer window (scripts/dmg/); a venv, because the
          # runner's Homebrew Python refuses a global pip install. Pinned. The
          # script fails, rather than fall back to a plain image, if it is missing.
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild==1.6.7
          export DMGBUILD="$RUNNER_TEMP/dmgvenv/bin/dmgbuild" REQUIRE_DMGBUILD=1
          sh scripts/bundle-mac.sh target/${{ matrix.target }}/release one-mk-${{ matrix.target }}.app.zip
          # What the updater will check on every Mac: a Developer ID chain,
          # a team, and (notarized) a stapled ticket.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            rm -rf "$RUNNER_TEMP/check" && mkdir "$RUNNER_TEMP/check"
            ditto -x -k one-mk-${{ matrix.target }}.app.zip "$RUNNER_TEMP/check"
            codesign --verify --deep --strict "--test-requirement==anchor apple generic" "$RUNNER_TEMP/check/one-mk.app" \
              || { echo "::error::one-mk.app is not signed with a Developer ID; the updater would refuse it" >&2; exit 1; }
            codesign --display --verbose=4 "$RUNNER_TEMP/check/one-mk.app" 2>&1 | grep -q '^TeamIdentifier=[A-Z0-9]\{10\}$' \
              || { echo "::error::one-mk.app has no team identifier; the updater would refuse it" >&2; exit 1; }
            xcrun stapler validate "$RUNNER_TEMP/check/one-mk.app" \
              || { echo "::error::one-mk.app has no stapled notarization ticket" >&2; exit 1; }
          fi
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          choco install innosetup -y --no-progress >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$v" "//DReleaseDir=..\\target\\${{ matrix.target }}\\release" installer/one-mk.iss
          ./one-mk-${{ matrix.target }}-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART "//DIR=$(cygpath -w "$PWD/installed")"
          "$PWD/installed/one-mk.exe" id
      - name: Linux .deb
        if: runner.os == 'Linux'
        run: |
          sh scripts/bundle-deb.sh target/${{ matrix.target }}/release one-mk-${{ matrix.target }}.deb
          # apt installs what the package depends on (a bare dpkg -i stops at the first missing library).
          sh scripts/apt-install.sh "$PWD/one-mk-${{ matrix.target }}.deb"
          one-mk id
      # AppImage (docs/PACKAGING.md). appimagetool is pinned by version and
      # checksum. The script runs `AppRun --version` on the AppDir before
      # packing it.
      - name: Linux AppImage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
        run: |
          if ! command -v desktop-file-validate >/dev/null; then
            if ! sh scripts/apt-install.sh desktop-file-utils; then
              # appimagetool will not pack without desktop-file-validate, so use
              # the built-in stand-in rather than fail the release.
              echo "::warning::desktop-file-utils could not be installed (the package hosts did not resolve); validating the desktop file with scripts/desktop-file-validate-lite.sh"
              mkdir -p "$RUNNER_TEMP/dfv"
              install -m 0755 scripts/desktop-file-validate-lite.sh "$RUNNER_TEMP/dfv/desktop-file-validate"
              export PATH="$RUNNER_TEMP/dfv:$PATH"
            fi
          fi
          mkdir -p "$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool/appimagetool"
          OUT_DIR="$RUNNER_TEMP/appimage" APPIMAGETOOL="$RUNNER_TEMP/appimagetool/appimagetool" sh scripts/package-appimage.sh
          mv "$RUNNER_TEMP/appimage/one-mk-${{ matrix.target }}.AppImage" .
          "./one-mk-${{ matrix.target }}.AppImage" --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: one-mk-*.*

  publish:
    needs: [test, release-checks, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The scripts that write the Homebrew and Flatpak files.
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # Every file the release advertises is made here, before anything is
      # public: the Homebrew cask and formula (checksums of the two .dmg
      # files and of the tag's source tarball, which exists once the tag is
      # pushed) and the Flatpak source bundle (the manifest names the Linux
      # tarball's release URL, with the checksum of the file uploaded
      # there below, and holds every other file it names). Putting them in
      # a tap or on Flathub is by hand.
      - name: Homebrew and Flatpak files
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          src=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)
          SOURCE_SHA256=$src sh scripts/package-homebrew.sh
          sh scripts/package-flatpak.sh dist/one-mk-x86_64-unknown-linux-gnu.tar.gz "$base/one-mk-x86_64-unknown-linux-gnu.tar.gz"
      # What is uploaded, and SHA256SUMS over all of it.
      - name: Stage the assets
        run: |
          mkdir release-files
          cp dist/one-mk-* dist/homebrew/one-mk.rb dist/homebrew/one-mk-source.rb release-files/
      - name: Generate and sign update manifest
        env:
          ONE_MK_UPDATE_SIGNING_KEY: ${{ secrets.ONE_MK_UPDATE_SIGNING_KEY }}
          # Repository variables, empty unless a bad release has to be
          # withdrawn (scripts/make-update-manifest.sh, docs/UPDATES.md).
          ONE_MK_REVOKED: ${{ vars.ONE_MK_REVOKED }}
          ONE_MK_MINIMUM_SUPPORTED_VERSION: ${{ vars.ONE_MK_MINIMUM_SUPPORTED_VERSION }}
        run: |
          bash scripts/make-update-manifest.sh release-files "$GITHUB_RUN_NUMBER"
          bash scripts/sign-update-manifest.sh release-files
      - name: Checksum all staged assets including the signed manifest
        run: |
          cd release-files && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Notes
        run: |
          cat > notes.md <<'MD'
          ## Download

          | System | File |
          |---|---|
          | macOS, Apple silicon (M1 and later) | `one-mk-aarch64-apple-darwin.dmg` |
          | macOS, Intel | `one-mk-x86_64-apple-darwin.dmg` |
          | Windows 10/11, 64-bit | `one-mk-x86_64-pc-windows-msvc-setup.exe` |
          | Debian, Ubuntu and relatives, 64-bit (Wayland) | `one-mk-x86_64-unknown-linux-gnu.deb` |
          | Other Linux, 64-bit, nothing to install (AppImage) | `one-mk-x86_64-unknown-linux-gnu.AppImage` |
          | Other Linux, 64-bit | `one-mk-x86_64-unknown-linux-gnu.tar.gz` |

          On macOS and Linux the one-line installer picks the right file:
          `curl -fsSL https://raw.githubusercontent.com/samer2373/one-mk/main/install.sh | sh`

          On macOS, open the `.dmg` and drag oneMK onto Applications (the `.app.zip` is what the installer uses). The AppImage runs where it is: make it executable and open it (`./one-mk-x86_64-unknown-linux-gnu.AppImage pair` and the other commands work too). The `.zip` and `.tar.gz` files hold only the programs, for people who prefer to unpack them by hand. `SHA256SUMS` lists checksums for every file.

          For packagers: `one-mk.rb` (Homebrew cask), `one-mk-source.rb` (Homebrew formula, builds from source) and `one-mk-flatpak-sources.tar.gz` (Flatpak manifest and the files it names) are attached too.
          MD
          # What's new, written by hand for the release: put it first when the
          # tag has a file (docs/release-notes/v0.1.13.md); no file, no change.
          if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            { cat "docs/release-notes/$GITHUB_REF_NAME.md"; echo; cat notes.md; } > notes.full
            mv notes.full notes.md
          fi
      # Published only once every asset is up: a draft first (a re-run
      # can replace a draft, never a published release), then every file,
      # checked against what the release lists, then made public.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$tag" --notes-file notes.md --generate-notes
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Refusing to overwrite a published release. Publish a new version with a higher sequence.' >&2
            exit 1
          fi
          gh release upload "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          export LC_ALL=C   # one collation for sort and comm
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > uploaded
          (cd release-files && ls) | sort > staged
          missing=$(comm -23 staged uploaded)
          if [ -n "$missing" ]; then
            echo "not uploaded: $missing" >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
