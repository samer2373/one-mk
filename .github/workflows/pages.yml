# Publishes the landing page in site/ to GitHub Pages:
# https://samer2373.github.io/one-mk/ (a project site under /one-mk/).
# Settings > Pages > Source must be "GitHub Actions". See site/README.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Sent by the release workflow once a release is public (its sizes are on the page).
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site's public address. For a custom domain, change this one line
      # (and add site/CNAME with the domain).
      SITE_URL: https://samer2373.github.io/one-mk/
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Copy the site without its tools and source-only files
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -rf _site/tools _site/README.md _site/css/fonts-file.css

      # The sizes are those of the release whose version the page shows (the
      # checkout's), not of whichever release is the latest: main can be ahead
      # of, or behind, what is published. The release workflow starts this one
      # after it publishes. No such release yet: the sizes in the source stay.
      - name: Read the download sizes from this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sh scripts/version.sh)"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" > release.json \
            && python3 -c 'import json; [print(a["name"], a["size"], sep="\t") for a in json.load(open("release.json"))["assets"]]' > sizes.tsv \
            || { echo "::warning::could not read the release $tag; keeping the sizes in the source"; : > sizes.tsv; }

      - name: Stamp the release version, the address and the sizes
        run: sh site/tools/stamp.sh _site "$(sh scripts/version.sh)" "$SITE_URL" sizes.tsv

      - name: Check every local link resolves
        run: |
          missing=0
          for f in _site/index.html _site/404.html; do
            for ref in $(grep -oE '(src|href|srcset)="[^"#][^"]*"' "$f" | sed -E 's/^[a-z]+="//; s/"$//' | tr ',' '\n' | awk '{print $1}'); do
              case $ref in http*|mailto:*|data:*|//*) continue ;; esac
              [ -e "_site/$ref" ] || { echo "missing: $ref (in $f)"; missing=1; }
            done
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
