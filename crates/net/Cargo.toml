[package]
name = "one-mk-net"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
hostname = "0.4.2"
mdns-sd = "0.21.6"
one-mk-proto = { version = "0.1.6", path = "../proto" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.10.3"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
