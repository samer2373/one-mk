name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-14,        target: x86_64-apple-darwin }
          - { os: ubuntu-22.04,    target: x86_64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p one-mk -p one-mk-tray -p one-mk-app
      - name: Package
        shell: bash
        run: |
          d=target/${{ matrix.target }}/release
          name=one-mk-${{ matrix.target }}
          mkdir "$name"
          if [ "${{ runner.os }}" = Windows ]; then
            cp $d/one-mk.exe $d/one-mk-tray.exe $d/one-mk-app.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp $d/one-mk $d/one-mk-tray $d/one-mk-app "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Mac app
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERT_P12" ]; then
            kc=$RUNNER_TEMP/sign.keychain-db
            pw=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            export SIGN_IDENTITY="Developer ID Application"
          fi
          sh scripts/bundle-mac.sh target/${{ matrix.target }}/release one-mk-${{ matrix.target }}.app.zip
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          choco install innosetup -y --no-progress >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$v" "//DReleaseDir=..\\target\\${{ matrix.target }}\\release" installer/one-mk.iss
          ./one-mk-${{ matrix.target }}-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART "//DIR=$(cygpath -w "$PWD/installed")"
          "$PWD/installed/one-mk.exe" id
      - name: Linux .deb
        if: runner.os == 'Linux'
        run: |
          sh scripts/bundle-deb.sh target/${{ matrix.target }}/release one-mk-${{ matrix.target }}.deb
          sudo dpkg -i one-mk-${{ matrix.target }}.deb
          one-mk id
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: one-mk-*.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum one-mk-* > SHA256SUMS
      - name: Notes
        run: |
          cat > notes.md <<'MD'
          ## Download

          | System | File |
          |---|---|
          | macOS, Apple silicon (M1 and later) | `one-mk-aarch64-apple-darwin.dmg` |
          | macOS, Intel | `one-mk-x86_64-apple-darwin.dmg` |
          | Windows 10/11, 64-bit | `one-mk-x86_64-pc-windows-msvc-setup.exe` |
          | Debian, Ubuntu and relatives, 64-bit (Wayland) | `one-mk-x86_64-unknown-linux-gnu.deb` |
          | Other Linux, 64-bit | `one-mk-x86_64-unknown-linux-gnu.tar.gz` |

          On macOS and Linux the one-line installer picks the right file:
          `curl -fsSL https://raw.githubusercontent.com/samer2373/one-mk/main/install.sh | sh`

          On macOS, open the `.dmg` and drag one·mk onto Applications (the `.app.zip` is what the installer uses). The `.zip` and `.tar.gz` files hold only the programs, for people who prefer to unpack them by hand. `SHA256SUMS` lists checksums for every file.
          MD
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
