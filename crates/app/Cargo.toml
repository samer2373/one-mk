[package]
name = "one-mk-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
description = "The oneMK window: arrange, pair and set up your computers"

[features]
design-evidence = []

[[bin]]
name = "one-mk-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
one-mk-ctl = { path = "../ctl" }
one-mk-proto = { path = "../proto" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui = "0.37.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.13.3"
one-mk-wallpaper = { path = "../wallpaper-player" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The see-through window (chrome.rs): two messages to the window and one to
# the shared workspace.
objc2 = "0.6.5"
raw-window-handle = "0.6"
