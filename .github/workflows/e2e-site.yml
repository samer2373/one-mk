# End-to-end tests of the landing page (site/) in Chromium, Firefox and WebKit,
# at phone, tablet, laptop and large-desktop sizes. See e2e/README.md.
name: Site e2e

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "e2e/**"
      - ".github/workflows/e2e-site.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "site/**"
      - "e2e/**"
      - ".github/workflows/e2e-site.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the test tools
        working-directory: e2e
        run: npm ci

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      - name: Install the browsers and their system libraries
        working-directory: e2e
        run: npm run browsers:deps

      # The page's own checks (weight, no WebGL, reduced motion, file://, the
      # download chooser as unit tests), in the Chrome the runner already has.
      - name: Page checks (site/tools/checks.mjs)
        run: node site/tools/checks.mjs "$RUNNER_TEMP/site-checks"

      # Every test on every device profile; the runner starts and stops its own
      # `python3 -m http.server` for the site.
      - name: Run the suite
        working-directory: e2e
        run: npm test

      - name: Run the suite from file://
        working-directory: e2e
        run: npm run test:file

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-site-traces
          path: |
            e2e/.e2e/results/
            e2e/.e2e/report.json
            e2e/.e2e/junit.xml
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
